# Publishes the current stable Chrome major version in current-chrome-version.txt.
# The Chromium Mask extension fetches that file from raw.githubusercontent.com, so a bad value
# committed here reaches every user: only a plain integer that is not lower than the current
# value is ever written, and any failure fails the run (GitHub emails the repo owner).

name: Check for Latest Chrome Version

on:
  workflow_dispatch:

  schedule:
    - cron: "0 8 * * *"

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine latest stable Chrome major version
        id: latest
        run: |
          set -euo pipefail

          # Primary: Chrome for Testing. Fallback: Chromium Dash (tracks releases more closely).
          fetch_primary() {
            curl -fsS --retry 3 --max-time 30 \
              'https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions.json' \
              | jq -r '.channels.Stable.version'
          }
          fetch_fallback() {
            curl -fsS --retry 3 --max-time 30 \
              'https://chromiumdash.appspot.com/fetch_releases?channel=Stable&platform=Windows&num=1' \
              | jq -r '.[0].version'
          }

          MAJOR=""
          for source in fetch_primary fetch_fallback; do
            FULL=$($source || true)
            CANDIDATE="${FULL%%.*}"
            if [[ "$CANDIDATE" =~ ^[0-9]{2,3}$ ]]; then
              echo "Latest stable via $source: $FULL"
              MAJOR="$CANDIDATE"
              echo "full=$FULL" >> "$GITHUB_OUTPUT"
              break
            fi
            echo "::warning::$source returned an unusable value: '${FULL}'"
          done

          if [ -z "$MAJOR" ]; then
            echo "::error::No source returned a valid Chrome version"
            exit 1
          fi
          echo "major=$MAJOR" >> "$GITHUB_OUTPUT"

      - name: Update version file if newer
        id: update
        env:
          LATEST: ${{ steps.latest.outputs.major }}
        run: |
          set -euo pipefail
          CURRENT=$(tr -d '[:space:]' < current-chrome-version.txt 2>/dev/null || true)
          echo "Current: '${CURRENT}'  Latest: '${LATEST}'"

          if [[ "$CURRENT" =~ ^[0-9]+$ ]] && [ "$LATEST" -le "$CURRENT" ]; then
            echo "No newer version. Nothing to do."
            echo "updated=false" >> "$GITHUB_OUTPUT"
          else
            echo "$LATEST" > current-chrome-version.txt
            echo "updated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated version
        if: steps.update.outputs.updated == 'true'
        env:
          MAJOR: ${{ steps.latest.outputs.major }}
          FULL: ${{ steps.latest.outputs.full }}
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add current-chrome-version.txt
          git commit -m "Update Chrome major version to $MAJOR (from $FULL)"
          git push origin main
